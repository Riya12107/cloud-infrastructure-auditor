[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-infrastructure-auditor"
version = "1.0.0"
description = "A CLI tool to audit cloud infrastructure and identify unused resources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.93",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0.3",
]

[project.scripts]
cloud-auditor = "src.cli.main:app"

[tool.setuptools.packages.find]
include = ["src*"]